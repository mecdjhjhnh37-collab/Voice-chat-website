<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,#020617,#2563eb,#111827);

}


.box{

width:90%;
max-width:420px;

padding:35px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(15px);

border-radius:30px;

text-align:center;

color:white;

}


.logo{

font-size:70px;
margin-bottom:20px;

}


h1{

font-size:35px;
margin-bottom:15px;

}


p{

font-size:18px;
margin-bottom:30px;

}


button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


#arabic{

background:#16a34a;
color:white;

}


#turkish{

background:#2563eb;
color:white;

}


</style>

</head>


<body>


<div class="box">


<div class="logo">
🎙️
</div>


<h1>
Mecd Voice
</h1>


<p id="welcome">
مرحبًا بك في موقع المطور مجد
</p>


<button id="arabic">
🇸🇦 العربية
</button>


<button id="turkish">
🇹🇷 Türkçe
</button>


</div>



<script>


document.getElementById("arabic").onclick = ()=>{

localStorage.setItem("language","ar");

window.location.href="login.html";

};



document.getElementById("turkish").onclick = ()=>{

localStorage.setItem("language","tr");

window.location.href="login.html";

};


</script>
<script>

const lang = localStorage.getItem("language") || "ar";

const welcome = document.getElementById("welcome");


if(lang === "tr"){

welcome.textContent =
"Geliştirici Mecd'in sitesine hoş geldiniz";

}else{

welcome.textContent =
"مرحبًا بك في موقع المطور مجد";

}

</script>

</body>

</html>
