<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1d4ed8,#111827);
padding:20px;
}

.box{
width:100%;
max-width:420px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border-radius:30px;
padding:35px;
text-align:center;
color:white;
box-shadow:0 0 35px rgba(0,0,0,.5);
}

.logo{
font-size:70px;
margin-bottom:20px;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
font-size:18px;
margin-bottom:30px;
opacity:.9;
}

button{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

#arabic{
background:#16a34a;
color:white;
}

#turkish{
background:#2563eb;
color:white;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">🎙️</div>

<h1>Mecd Voice</h1>

<p>
اختر لغتك<br>
Dilinizi seçin
</p>

<button id="arabic">🇸🇦 العربية</button>

<button id="turkish">🇹🇷 Türkçe</button>

</div>

<script>

document.getElementById("arabic").onclick=function(){

localStorage.setItem("language","ar");

window.location.href="login.html";

};

document.getElementById("turkish").onclick=function(){

localStorage.setItem("language","tr");

window.location.href="login.html";

};

</script>

</body>
</html>
