<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice - Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="welcome-box">


<div class="logo">
🎙️
</div>


<h1>
Mecd Voice
</h1>


<p id="loginText">
تسجيل الدخول إلى الموقع
</p>


<button id="google">
🔐 تسجيل الدخول بواسطة Google
</button>


<button id="backBtn">
⬅️ رجوع
</button>


</div>

<script>

const lang = localStorage.getItem("language") || "ar";

if(lang === "tr"){

document.getElementById("title").textContent = "Giriş Yap";
document.getElementById("text").textContent = "Google hesabınızla giriş yapın";
document.getElementById("google").textContent = "🔐 Google ile giriş yap";
document.getElementById("back").textContent = "⬅️ Geri";

}else{

document.getElementById("title").textContent = "تسجيل الدخول";
document.getElementById("text").textContent = "سجل الدخول باستخدام Google";
document.getElementById("google").textContent = "🔐 تسجيل الدخول بواسطة Google";
document.getElementById("back").textContent = "⬅️ رجوع";

}

  </script>

<script type="module" src="login.js"></script>


</body>

</html>
