<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecd Voice - Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1d4ed8,#111827);
padding:20px;
}

.box{
width:100%;
max-width:420px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border-radius:30px;
padding:35px;
text-align:center;
color:white;
box-shadow:0 0 35px rgba(0,0,0,.5);
}

.logo{
font-size:70px;
margin-bottom:20px;
}

h1{
margin-bottom:15px;
}

p{
margin-bottom:25px;
font-size:18px;
}

button{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#google{
background:white;
color:#111;
}

#back{
background:#2563eb;
color:white;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">🎙️</div>

<h1 id="title"></h1>

<p id="text"></p>

<button id="google"></button>

<button id="back"></button>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
