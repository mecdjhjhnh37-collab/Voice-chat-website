<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice Room</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
margin:0;
height:100vh;
background:#050505;
color:white;
display:flex;
justify-content:center;
}



.room{

width:100%;
max-width:430px;
height:100vh;

display:flex;
flex-direction:column;

background:#0b0b0b;

}



/* الشريط العلوي */

.header{

height:70px;
background:#111;

display:flex;
align-items:center;

padding:12px;

border-bottom:1px solid #222;

}


.room-img{

width:45px;
height:45px;

border-radius:50%;

background:#00a884;

display:flex;
align-items:center;
justify-content:center;

font-size:22px;

margin-left:10px;

}



.info h2{

margin:0;
font-size:18px;

}


.info p{

margin:4px 0;

font-size:12px;

color:#aaa;

}




/* المحادثة */

.chat{

flex:1;

padding:12px;

overflow:auto;

background:#070707;

}



.message{

background:#1c1c1c;

padding:10px 14px;

border-radius:15px;

width:max-content;

max-width:80%;

margin-bottom:10px;

}



.my-message{

background:#005c4b;

margin-left:auto;

}




/* زر الكلام */


.voice-area{

display:flex;

justify-content:center;

padding:10px;

}


.talk{

width:75px;

height:75px;

border-radius:50%;

background:#00a884;

color:white;

font-size:30px;

border:none;

box-shadow:0 0 20px #00a884;

}




/* الأسفل */


.bottom{

background:#111;

padding:8px;

display:flex;

align-items:center;

gap:8px;

}



.input{

flex:1;

height:42px;

border-radius:22px;

border:none;

outline:none;

background:#222;

color:white;

padding:0 15px;

}



.icon{

width:40px;

height:40px;

border-radius:50%;

border:none;

background:#222;

color:white;

font-size:18px;

}



.send{

background:#00a884;

}



.call-bar{

display:flex;

justify-content:center;

gap:12px;

padding:8px;

background:#111;

}



.call{

width:45px;

height:45px;

border-radius:50%;

border:none;

font-size:20px;

background:#222;

color:white;

}


</style>

</head>


<body>


<div class="room">


<div class="header">


<div class="room-img">
🎙️
</div>


<div class="info">

<h2 id="title">
Mecd Voice
</h2>

<p id="roomId">
Room ID
</p>


</div>


</div>




<div class="chat" id="messages">


<div class="message">
👋 Welcome
</div>


</div>



<div class="call-bar">


<button class="call">
📞
</button>


<button class="call">
🎥
</button>


<button class="call">
👥
</button>


</div>




<div class="voice-area">

<button class="talk">
🎙️
</button>

</div>





<div class="bottom">


<button class="icon">
😀
</button>


<input class="input" placeholder="Message...">


<button class="icon">
📎
</button>


<button class="icon send">
➤
</button>


</div>



</div>


<script type="module" src="room.js"></script>


</body>

</html>
