<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Voice Room</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
height:100vh;
background:#050505;
color:white;
}


.room{
width:100%;
max-width:430px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
background:#0b0b0b;
}



/* رأس الغرفة */

.header{

height:70px;
background:#111;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid #222;

}


.room-img{

width:48px;
height:48px;
border-radius:50%;
background:#00a884;

display:flex;
align-items:center;
justify-content:center;

font-size:24px;

}


.info{

margin-left:12px;

}


.info h2{

margin:0;
font-size:19px;

}


.info p{

margin:4px 0;
color:#00a884;
font-size:12px;

}



/* المحادثة */

.chat{

flex:1;
padding:15px;
overflow:auto;
background:#070707;

}



.message{

background:#202c33;
padding:10px 14px;
border-radius:15px;

width:max-content;
max-width:80%;

margin-bottom:10px;

}



.my-message{

background:#005c4b;
margin-left:auto;

}



/* الأسفل */

.bottom{

background:#111;
padding:8px;

display:flex;
align-items:center;
gap:6px;

}



.input{

flex:1;
height:42px;

border:0;
outline:0;

border-radius:22px;

background:#222;
color:white;

padding:0 15px;

}



.btn{

width:40px;
height:40px;

border:0;

border-radius:50%;

background:#222;

color:white;

font-size:18px;

}



.mic{

background:#00a884;

}



.call{

background:#075e54;

}



.send{

background:#00a884;

}



</style>

</head>


<body>


<div class="room">


<div class="header">


<div class="room-img">

🎙️

</div>


<div class="info">

<h2 id="roomName">
Mecd Voice
</h2>

<p id="roomId">
🆔 Room ID: ----
</p>

</div>


</div>




<div class="chat" id="messages">


<div class="message">

👋 Welcome

</div>


</div>





<div class="bottom">


<button class="btn">
😀
</button>


<button class="btn">
📎
</button>


<button class="btn mic">
🎙️
</button>


<input 
class="input"
id="messageInput"
placeholder="Message..."
>


<button class="btn call">
📞
</button>


<button class="btn call">
🎥
</button>


<button class="btn send">
➤
</button>


</div>



</div>



<script type="module" src="room.js"></script>


</body>

</html>
