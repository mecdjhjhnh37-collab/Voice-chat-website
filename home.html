<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecd Voice</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1d4ed8,#111827);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:90%;
max-width:420px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
padding:30px;
border-radius:25px;
text-align:center;
}

img{
width:110px;
height:110px;
border-radius:50%;
border:3px solid white;
margin-bottom:20px;
}

h1{
margin-bottom:10px;
}

p{
margin-bottom:20px;
color:#7CFC98;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
background:#2563eb;
color:white;
}
</style>

</head>
<body>

<div class="box">

<img id="photo">

<h1 id="name"></h1>

<p>🟢 متصل الآن</p>

<button>🎙️ إنشاء غرفة</button>

<button>🚪 دخول غرفة</button>

<button>🌍 الغرف العامة</button>

<button>⚙️ الإعدادات</button>

</div>

<script>

document.getElementById("photo").src =
localStorage.getItem("userPhoto");

document.getElementById("name").textContent =
localStorage.getItem("userName");

</script>

</body>
</html>
